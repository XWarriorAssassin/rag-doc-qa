name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `npm run build` runs `tsc -b` before `vite build` (see package.json)
      # — one command doubles as the typecheck step and a build-succeeds
      # smoke test. No frontend unit tests exist yet (React Testing Library
      # + Vitest would be the natural next step — see README), so a clean
      # build is the CI signal for this package for now.
      - run: npm run build
